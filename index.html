<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Anka Web</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --bg-primary: #121214;
            --bg-secondary: #18181b;
            --bg-tertiary: #27272a;
            --text-color: #f4f4f5;
            --text-secondary: #a1a1aa;
            --accent: #ff4757;
            --border-color: #27272a;
        }

        body.light-theme {
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e4e6eb;
            --text-color: #050505;
            --text-secondary: #65676b;
            --accent: #ff4757;
            --border-color: #ced0d4;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        #toast-stack {
            position: fixed;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000001;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 13px;
            box-shadow: 0 10px 30px rgba(0,0,0,.4);
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.error {
            border-color: #f38ba8;
            color: #ffd7e0;
        }

        .side-btn.active { color: var(--accent); }
    </style>
</head>
<body>

<div class="main-container">
    <div id="titlebar">
        <div id="top-tabs-container">
            <div style="position: relative; display: inline-block;">
                <button id="tab-dropdown-btn" onclick="toggleTabDropdown(event)" title="Sekmeler Listesi">▼</button>
                <div id="tab-dropdown-menu" style="display: none; position: fixed; top: 45px; left: 12px; width: 300px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; box-shadow: 0 25px 50px rgba(0,0,0,0.8); z-index: 9999999; padding: 10px; flex-direction: column; gap: 8px; backdrop-filter: blur(16px);">
                    <input type="text" id="tab-search-input" placeholder="Sekmelerde ara..." oninput="filterTabs(this.value)" style="width: 100%; height: 36px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 8px; padding: 0 12px; color: var(--text-color); font-size: 13px; outline: none;">
                    <div id="tab-list-dropdown" style="display: flex; flex-direction: column; gap: 4px; max-height: 250px; overflow-y: auto; scrollbar-width: thin;"></div>
                </div>
            </div>
            <div id="tab-bar"></div>
            <button id="new-tab-btn" onclick="createNewTab(getHomeUrl())" title="Yeni Sekme (Ctrl+T)">＋</button>
        </div>
        <div id="window-controls">
            <button class="w-control-btn" id="min-btn" title="Küçült">-</button>
            <button class="w-control-btn" id="max-btn" title="Büyüt">▢</button>
            <button class="w-control-btn" id="close-btn" title="Kapat">×</button>
        </div>
    </div>

    <div id="app-container">
        <div id="sidebar">
            <img src="assets/icons/logo.png" class="logo" onclick="location.reload()" alt="Logo">
            <div style="flex:1"></div>

            <div class="side-btn" id="btn-paint" onclick="togglePaintMenu()"><i>✎</i><span>KALEM</span></div>
            <div class="side-btn" id="btn-keyboard" onclick="toggleKeyboard()"><i>⌨</i><span>KLAVYE</span></div>
            <div class="side-btn" onclick="createNewTab(getHomeUrl())"><i>➕</i><span>SEKME</span></div>
            <div class="side-btn" id="btn-split" onclick="toggleSplitScreen()"><i>⊞</i><span>BÖL</span></div>
            <div class="side-btn" onclick="openAISession()"><i>✦</i><span>AI</span></div>
            <div class="side-btn" id="btn-limit" onclick="toggleLimit()"><i>🔒︎</i><span>LİMİT</span></div>

            <div style="flex:1"></div>

            <div class="side-btn" onclick="toggleHelp()"><i>?</i><span>YARDIM</span></div>
            <div class="side-btn" onclick="toggleSettings()"><i>⚙</i><span>AYARLAR</span></div>
        </div>

        <div id="main-view">

            <div id="toolbar">
                <button class="nav-tool-btn" onclick="goBack()" title="Geri (Alt+←)">◀</button>
                <button class="nav-tool-btn" onclick="goForward()" title="İleri (Alt+→)">▶</button>
                <button class="nav-tool-btn" onclick="reloadTab()" title="Yenile (Ctrl+R)">⟳</button>

                <input type="text" id="url-input" placeholder="Güvenli Arama...">

                <button id="downloads-btn" class="nav-tool-btn" onclick="openDownloadsPage()" title="İndirilenler">
                    ⭳
                    <span class="dl-badge" id="dl-badge"></span>
                </button>
                <button id="ai-mode-btn" class="nav-tool-btn" onclick="toggleAiMode()" title="AI Modu (Ctrl+Shift+A)">
                    <span>✦</span><span class="ai-label">AI</span>
                </button>
            </div>

            <div id="wv-container"></div>

        </div>
    </div>

    <div id="update-banner" class="glass-panel" style="display: none; position: fixed; top: 80px; right: 20px; width: 340px; background: rgba(17, 17, 27, 0.95); backdrop-filter: blur(16px); color: #cdd6f4; padding: 20px; border-radius: 16px; border: 1px solid rgba(243, 139, 168, 0.3); z-index: 99999; font-family: 'Segoe UI', system-ui, sans-serif; box-shadow: 0 20px 50px rgba(0,0,0,0.8); box-sizing: border-box; flex-direction: column;">
        <div id="update-step-1">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <strong style="color: #f38ba8; font-size: 15px; display: flex; align-items: center; gap: 6px;">🚀 Güncelleme Mevcut</strong>
                <span style="font-size: 12px; background: #313244; padding: 4px 8px; border-radius: 6px; color: #a6adc8; font-weight: 500; border: 1px solid #45475a;">Anka Web</span>
            </div>
            <p id="update-info" style="font-size: 13px; line-height: 1.5; margin: 0 0 16px 0; color: #bac2de;">Daha hızlı ve kararlı bir deneyim için yeni bir güncelleme hazır.</p>
            <div id="progress-container" style="display: none; width: 100%; background: #313244; height: 6px; border-radius: 3px; overflow: hidden; margin-bottom: 16px;">
                <div id="progress-bar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #f38ba8, #fab387); transition: width 0.1s linear;"></div>
            </div>
            <div id="update-actions" style="display: flex; gap: 10px;">
                <button id="later-btn" style="flex: 1; padding: 10px; background: #313244; border: 1px solid #45475a; color: #cdd6f4; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px;">Daha Sonra</button>
                <button id="update-btn" style="flex: 2; padding: 10px; background: #f38ba8; border: none; color: #11111b; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 13px;">Şimdi Güncelle</button>
            </div>
        </div>
        <div id="update-step-2" style="display: none; text-align: center;">
            <strong style="color: #fab387; font-size: 15px; display: block; margin-bottom: 10px;">⚠️ Kapatma İzni Gerekli</strong>
            <button id="close-app-btn" style="width: 100%; padding: 12px; background: #f38ba8; border: none; color: #11111b; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 13px;">Programı Kapat</button>
        </div>
        <div id="update-step-error" style="display: none;">
            <strong style="color: #f38ba8; font-size: 15px; display: block; margin-bottom: 10px;">❌ Hata Oluştu</strong>
            <p id="error-message" style="font-size: 13px; line-height: 1.5; margin: 0 0 12px 0; color: #f38ba8; background: rgba(243, 139, 168, 0.1); padding: 8px; border-radius: 6px; font-family: monospace; border: 1px solid rgba(243, 139, 168, 0.2);"></p>
            <button id="error-close-btn" style="width: 100%; padding: 10px; background: #313244; border: 1px solid #45475a; color: #cdd6f4; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px;">Kapat</button>
        </div>
    </div>

    <div id="toast-stack"></div>
    <div id="notification-container" style="position: fixed; top: 50px; left: 50%; transform: translateX(-50%); z-index: 1000000; pointer-events: none;"></div>

    <div id="paint-menu">
        <div id="paint-handle" style="cursor: move; background: var(--accent); margin: -15px -15px 10px -15px; padding: 8px; border-radius: 14px 14px 0 0; display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; gap: 5px; align-items: center; margin-left: 10px;">
                <span style="width: 4px; height: 4px; background: white; border-radius: 50%;"></span>
                <span style="width: 4px; height: 4px; background: white; border-radius: 50%;"></span>
                <span style="width: 4px; height: 4px; background: white; border-radius: 50%;"></span>
            </div>
            <button onclick="togglePaintMenu()" style="background: rgba(0,0,0,0.2); border: none; color: white; width: 24px; height: 24px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; display: flex; align-items: center; justify-content: center;">✕</button>
        </div>

        <div class="tool-row" style="grid-template-columns: repeat(4, 1fr); margin-bottom: 5px;">
            <div class="t-btn" onclick="setBoardMode('transparent')" title="Site">🌐</div>
            <div class="t-btn" onclick="setBoardMode('white')" title="Beyaz">⬜</div>
            <div class="t-btn" onclick="setBoardMode('lined')" title="Çizgili">📝</div>
            <div class="t-btn" onclick="setBoardMode('grid')" title="Kareli">🏁</div>
        </div>

        <div class="tool-row">
            <div class="t-btn active" id="t-pen" onclick="setTool('pen')">🖊️</div>
            <div class="t-btn" id="t-neon" onclick="setTool('neon')">✨</div>
            <div class="t-btn" id="t-eraser" onclick="setTool('eraser')">🧽</div>
        </div>

        <div class="tool-row">
            <div class="t-btn" onclick="toggleMathTool('ruler')">📏</div>
            <div class="t-btn" onclick="toggleMathTool('protractor')">📐</div>
            <div class="t-btn" onclick="undo()">↩️</div>
        </div>

        <div style="display:flex; flex-direction:column; gap:8px; background:rgba(0,0,0,0.3); padding:10px; border-radius:12px;">
            <div style="display:flex; gap:10px; align-items:center;">
                <input type="color" id="p-color" value="#ff4757" style="width:36px; height:30px; border:none; background:none; cursor:pointer;">
                <input type="range" id="p-width" min="1" max="50" value="4" style="flex:1; accent-color:var(--accent);">
            </div>
            <button onclick="clearCanvas()" style="background:#ff4757; border:none; color:white; padding:6px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:10px;">TEMİZLE</button>
        </div>
    </div>

    <div id="ruler" class="math-tool" style="width:550px; height:90px; top:200px; left:300px;">
        <div class="tool-ctrl">
            <div class="c-btn" onmousedown="toolRotate(event, 'ruler')">🔄</div>
            <div class="c-btn" onmousedown="toolScale(event, 'ruler')">↔️</div>
            <div class="c-btn" onclick="this.parentElement.parentElement.style.display='none'">❌</div>
        </div>
        <img src="assets/icons/cetvel.png" alt="Cetvel" style="width:100%; height:100%;">
    </div>

    <div id="protractor" class="math-tool" style="width:350px; height:175px; top:400px; left:400px;">
        <div class="tool-ctrl">
            <div class="c-btn" onmousedown="toolRotate(event, 'protractor')">🔄</div>
            <div class="c-btn" onmousedown="toolScale(event, 'protractor')">↔️</div>
            <div class="c-btn" onclick="this.parentElement.parentElement.style.display='none'">❌</div>
        </div>
        <img src="assets/icons/açıölçer.png" alt="Açıölçer" style="width:100%; height:100%;">
    </div>

    <div id="keyboard">
        <div class="kb-row" id="row1"></div>
        <div class="kb-row" id="row2"></div>
        <div class="kb-row" id="row3"></div>
        <div class="kb-row">
            <div class="kb-key" style="width:400px" onclick="typeChar(' ')">BOŞLUK</div>
            <div class="kb-key" style="background:#e74c3c" onclick="toggleKeyboard()">KAPAT</div>
        </div>
    </div>

    <div id="draw-layer"><canvas id="main-canvas"></canvas></div>
</div>

<script>
    const { ipcRenderer } = require('electron');

    function getSetting(id, def) {
        const v = localStorage.getItem('set_' + id);
        return v === null ? def : v;
    }

    function setSetting(id, value) {
        try {
            localStorage.setItem('set_' + id, value);
            return true;
        } catch (err) {
            return false;
        }
    }

    const themeChannel = new BroadcastChannel('theme_settings');

    function applyThemeState(isDark) {
        document.body.classList.toggle('light-theme', !isDark);
        const icon = document.getElementById('theme-icon');
        const btn = document.getElementById('btn-theme');
        if (btn) btn.classList.toggle('active', !isDark);
    }

    function applySavedTheme() {
        const stored = localStorage.getItem('set_dark-mode');
        const isDark = stored === null ? true : stored === 'true';
        applyThemeState(isDark);
    }
    applySavedTheme();

    function toggleTheme() {
        const isCurrentlyDark = !document.body.classList.contains('light-theme');
        const nextIsDark = !isCurrentlyDark;
        setSetting('dark-mode', nextIsDark ? 'true' : 'false');
        applyThemeState(nextIsDark);
        themeChannel.postMessage({ id: 'dark-mode', val: nextIsDark });
        if (typeof showToast === 'function') showToast(nextIsDark ? 'Koyu tema açıldı' : 'Açık tema açıldı');
        const settingsToggle = document.querySelector('.settings-toggle input');
        const darkRow = document.getElementById('status-dark-mode');
    }

    themeChannel.onmessage = (event) => {
        if (event.data && event.data.id === 'dark-mode') {
            applyThemeState(event.data.val);
        }
    };

    window.addEventListener('storage', (e) => {
        if (e.key === 'set_dark-mode') applySavedTheme();
    });

    function openDownloadsFolder() {
        safeIpcSend('open-downloads-folder');
    }

    let toastTimer = null;
    function showToast(message, type = 'info') {
        const stack = document.getElementById('toast-stack');
        if (!stack) { return; }
        const el = document.createElement('div');
        el.className = 'toast' + (type === 'error' ? ' error' : '');
        el.textContent = message;
        stack.appendChild(el);
        requestAnimationFrame(() => el.classList.add('show'));
        setTimeout(() => {
            el.classList.remove('show');
            setTimeout(() => el.remove(), 300);
        }, 3500);
    }

    window.addEventListener('unhandledrejection', (e) => {
        showToast('İşlem tamamlanamadı: ' + (e.reason && e.reason.message ? e.reason.message : 'bilinmeyen hata'), 'error');
    });

    function safeIpcSend(channel, payload) {
        try {
            ipcRenderer.send(channel, payload);
            return true;
        } catch (err) {
            showToast('Bağlantı hatası (' + channel + ')', 'error');
            return false;
        }
    }

    let aiModeActive = getSetting('ai-mode-active', 'false') === 'true';

    function isAiModeActive() {
        return aiModeActive;
    }

    function setAiMode(state) {
        aiModeActive = !!state;
        const btn = document.getElementById('ai-mode-btn');
        if (btn) btn.classList.toggle('active', aiModeActive);
        setSetting('ai-mode-active', aiModeActive ? 'true' : 'false');
        safeIpcSend('ai-mode-changed', aiModeActive);
    }

    let aiToggleLock = false;
    function toggleAiMode() {
        if (aiToggleLock) return;
        aiToggleLock = true;
        setAiMode(!aiModeActive);
        showToast(aiModeActive ? 'AI Modu Açık' : 'AI Modu Kapalı');
        setTimeout(() => { aiToggleLock = false; }, 180);
    }

    function getHomeUrl() {
        const startup = getSetting('startup-page', 'home');
        if (startup === 'blank') return 'about:blank';
        return 'newtab.html';
    }

    document.getElementById('min-btn')?.addEventListener('click', () => safeIpcSend('window-minimize'));
    document.getElementById('max-btn')?.addEventListener('click', () => safeIpcSend('window-maximize'));
    document.getElementById('close-btn')?.addEventListener('click', () => safeIpcSend('window-close'));

    const banner = document.getElementById('update-banner');
    const step1 = document.getElementById('update-step-1');
    const step2 = document.getElementById('update-step-2');
    const stepError = document.getElementById('update-step-error');
    const updateBtn = document.getElementById('update-btn');
    const laterBtn = document.getElementById('later-btn');
    const closeAppBtn = document.getElementById('close-app-btn');
    const errorCloseBtn = document.getElementById('error-close-btn');
    const infoText = document.getElementById('update-info');
    const progressContainer = document.getElementById('progress-container');
    const progressBar = document.getElementById('progress-bar');
    const errorMessage = document.getElementById('error-message');

    let cachedFilePath = '';

    ipcRenderer.on('update-available', (event, data) => {
        banner.style.display = 'flex';
        step1.style.display = 'block';
        step2.style.display = 'none';
        stepError.style.display = 'none';
        infoText.innerHTML = `<strong>Yeni Sürüm: ${data.version}</strong><br><small style="color: #a6adc8;">Otomatik yükleme hazırlandı.</small>`;
        updateBtn.style.display = '';
        progressContainer.style.display = 'none';
        laterBtn.style.display = '';
        updateBtn.onclick = () => {
            updateBtn.style.pointerEvents = 'none';
            laterBtn.style.display = 'none';
            updateBtn.style.opacity = '0.5';
            updateBtn.innerText = "Bağlanılıyor...";
            safeIpcSend('start-download', data.url);
        };
    });

    laterBtn.addEventListener('click', () => {
        safeIpcSend('hide-update-banner');
        banner.style.display = 'none';
    });

    ipcRenderer.on('download-progress', (event, percent) => {
        if (typeof percent !== 'number') return;
        if (updateBtn.style.display !== 'none') {
            updateBtn.style.display = 'none';
            progressContainer.style.display = 'block';
        }
        progressBar.style.width = percent + "%";
        infoText.innerHTML = `Güncelleniyor: <strong>%${percent}</strong>`;
    });

    ipcRenderer.on('download-complete', (event, filePath) => {
        cachedFilePath = filePath;
        step1.style.display = 'none';
        step2.style.display = 'block';
    });

    closeAppBtn.addEventListener('click', () => {
        if (cachedFilePath) {
            safeIpcSend('run-installer', cachedFilePath);
            safeIpcSend('close-app-for-update');
        }
    });

    function showError(message) {
        step1.style.display = 'none';
        step2.style.display = 'none';
        stepError.style.display = 'block';
        errorMessage.textContent = message;
    }

    ipcRenderer.on('download-error', (event, message) => showError(message));
    ipcRenderer.on('install-error', (event, message) => showError(message));

    errorCloseBtn.addEventListener('click', () => {
        safeIpcSend('hide-update-banner');
        banner.style.display = 'none';
    });

    function toggleTabDropdown(e) {
        if (e) e.stopPropagation();
        const menu = document.getElementById('tab-dropdown-menu');
        if (menu.style.display === 'flex') {
            menu.style.display = 'none';
        } else {
            menu.style.display = 'flex';
            renderTabListDropdown();
            const input = document.getElementById('tab-search-input');
            input.value = '';
            input.focus();
        }
    }

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, (c) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    function renderTabListDropdown(filter = '') {
        const listContainer = document.getElementById('tab-list-dropdown');
        listContainer.innerHTML = '';
        const tabs = document.querySelectorAll('.tab');
        let matchedCount = 0;
        const fragment = document.createDocumentFragment();

        tabs.forEach(tab => {
            const id = tab.id.replace('btn-', '');
            const titleEl = tab.querySelector('.tab-title');
            const title = titleEl ? titleEl.innerText : 'Yeni Sekme';
            const vw = document.getElementById(id);
            const url = vw && vw.getURL ? vw.getURL() : '';

            if (filter && !title.toLowerCase().includes(filter.toLowerCase()) && !url.toLowerCase().includes(filter.toLowerCase())) {
                return;
            }

            matchedCount++;
            const item = document.createElement('div');
            const isActive = id === (typeof activeTabId !== 'undefined' ? activeTabId : null);
            item.style.cssText = `display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 8px; cursor: pointer; transition: background-color 0.15s ease; background: ${isActive ? 'rgba(255, 71, 87, 0.2)' : 'transparent'}; color: ${isActive ? '#ff4757' : 'var(--text-color)'};`;
            const label = document.createElement('span');
            label.style.cssText = 'font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;';
            label.textContent = title;
            item.appendChild(label);
            item.addEventListener('click', () => switchTab(id));
            fragment.appendChild(item);
        });

        listContainer.appendChild(fragment);

        if (matchedCount === 0) {
            listContainer.innerHTML = `<div style="padding: 16px; text-align: center; color: var(--text-secondary); font-size: 13px;">Sekme bulunamadı</div>`;
        }
    }

    function filterTabs(query) {
        renderTabListDropdown(query);
    }

    window.addEventListener('click', (e) => {
        const dropdown = document.getElementById('tab-dropdown-menu');
        const btn = document.getElementById('tab-dropdown-btn');
        if (dropdown && dropdown.style.display === 'flex' && !dropdown.contains(e.target) && !btn.contains(e.target)) {
            dropdown.style.display = 'none';
        }
    });

    function togglePaintMenu() {
        const menu = document.getElementById('paint-menu');
        if (!menu) return;
        menu.classList.toggle('open');
        document.getElementById('btn-paint')?.classList.toggle('active', menu.classList.contains('open'));
    }

    function toggleKeyboard() {
        const kb = document.getElementById('keyboard');
        if (!kb) return;
        kb.classList.toggle('open');
        document.getElementById('btn-keyboard')?.classList.toggle('active', kb.classList.contains('open'));
    }

    function toggleSplitScreen() {
        if (typeof window.__toggleSplitScreen === 'function') {
            window.__toggleSplitScreen();
        }
    }

    function toggleLimit() {
        if (typeof window.__toggleLimit === 'function') {
            window.__toggleLimit();
        }
    }

    function toggleHelp() {
        if (typeof window.__toggleHelp === 'function') {
            window.__toggleHelp();
        }
    }

    function toggleSettings() {
        if (typeof window.__toggleSettings === 'function') {
            window.__toggleSettings();
        }
    }

    window.addEventListener('keydown', (e) => {
        const mod = e.ctrlKey || e.metaKey;
        if (mod && e.key.toLowerCase() === 't') {
            e.preventDefault();
            createNewTab(getHomeUrl());
        } else if (mod && e.shiftKey && e.key.toLowerCase() === 't') {
            e.preventDefault();
            if (typeof reopenClosedTab === 'function') reopenClosedTab();
        } else if (mod && e.shiftKey && e.key.toLowerCase() === 'n') {
            e.preventDefault();
            if (typeof createIncognitoTab === 'function') createIncognitoTab();
        } else if (mod && e.key.toLowerCase() === 'w') {
            e.preventDefault();
            if (typeof closeTab === 'function' && typeof activeTabId !== 'undefined') {
                closeTab(activeTabId, { stopPropagation(){} });
            }
        } else if (mod && e.key.toLowerCase() === 'l') {
            e.preventDefault();
            document.getElementById('url-input')?.focus();
            document.getElementById('url-input')?.select();
        } else if (mod && e.key.toLowerCase() === 'r') {
            e.preventDefault();
            if (typeof reloadTab === 'function') reloadTab();
        } else if (e.key === 'F5') {
            e.preventDefault();
            if (typeof reloadTab === 'function') reloadTab();
        } else if (e.altKey && e.key === 'ArrowLeft') {
            e.preventDefault();
            if (typeof goBack === 'function') goBack();
        } else if (e.altKey && e.key === 'ArrowRight') {
            e.preventDefault();
            if (typeof goForward === 'function') goForward();
        } else if (mod && e.key === 'Tab' && !e.shiftKey) {
            e.preventDefault();
            if (typeof cycleTab === 'function') cycleTab(1);
        } else if (mod && e.shiftKey && e.key === 'Tab') {
            e.preventDefault();
            if (typeof cycleTab === 'function') cycleTab(-1);
        } else if (mod && /^[1-8]$/.test(e.key)) {
            e.preventDefault();
            if (typeof switchTabByIndex === 'function') switchTabByIndex(parseInt(e.key, 10) - 1);
        } else if (mod && e.key === '9') {
            e.preventDefault();
            if (typeof switchTabByIndex === 'function') switchTabByIndex(-1);
        } else if (mod && e.key.toLowerCase() === 'f') {
            e.preventDefault();
            const vw = document.getElementById(typeof activeTabId !== 'undefined' ? activeTabId : '');
            if (vw && typeof openFindBar === 'function') openFindBar(vw);
        } else if (mod && e.key.toLowerCase() === 'u') {
            e.preventDefault();
            const vw = document.getElementById(typeof activeTabId !== 'undefined' ? activeTabId : '');
            if (vw && typeof toggleSideViewSource === 'function') toggleSideViewSource(vw);
        } else if (mod && e.shiftKey && e.key.toLowerCase() === 'm') {
            e.preventDefault();
            if (typeof activeTabId !== 'undefined' && typeof toggleMute === 'function') toggleMute(activeTabId);
        } else if (mod && e.shiftKey && e.key.toLowerCase() === 'a') {
            e.preventDefault();
            toggleAiMode();
        } else if (mod && e.shiftKey && e.key.toLowerCase() === 'd') {
            e.preventDefault();
            toggleTheme();
        } else if (e.key === 'F12') {
            e.preventDefault();
            const vw = document.getElementById(typeof activeTabId !== 'undefined' ? activeTabId : '');
            if (vw && vw.isDevToolsOpened && !vw.isDevToolsOpened()) vw.openDevTools();
        } else if (e.key === 'Escape') {
            const menu = document.getElementById('tab-dropdown-menu');
            if (menu) menu.style.display = 'none';
        }
    });

    window.addEventListener('load', () => {
        applySavedTheme();
        if (typeof setAiMode === 'function' && typeof isAiModeActive === 'function') {
            setAiMode(isAiModeActive());
        }
        if (typeof createNewTab === 'function' && document.querySelectorAll('.tab').length === 0) {
            createNewTab(getHomeUrl());
        }
        if (typeof window.applySetting === 'function') {
            const originalApplySetting = window.applySetting;
            window.applySetting = function(id, val) {
                originalApplySetting(id, val);
                if (id === 'dark-mode') {
                    const isDark = (val === true || val === 'true');
                    applyThemeState(isDark);
                    themeChannel.postMessage({ id: 'dark-mode', val: isDark });
                }
            };
        }
    });
</script>
