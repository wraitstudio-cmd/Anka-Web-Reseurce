<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anka Web</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --bg-primary: #121214;
            --bg-secondary: #18181b;
            --bg-tertiary: #27272a;
            --text-color: #f4f4f5;
            --text-secondary: #a1a1aa;
            --accent: #ff4757;
            --border-color: #27272a;
        }

        body.light-theme {
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e4e6eb;
            --text-color: #050505;
            --text-secondary: #65676b;
            --accent: #ff4757;
            --border-color: #ced0d4;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        #ai-mode-btn {
            display: flex; align-items: center; gap: 6px; padding: 0 14px; height: 34px;
            background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: 18px;
            color: var(--text-secondary); font-size: 12px; font-weight: 700; cursor: pointer;
            white-space: nowrap; transition: .2s; margin-right: 8px;
        }
        #ai-mode-btn.active { background: linear-gradient(90deg,#ff4757,#ff7a45); color:#fff; border-color:transparent; box-shadow:0 0 14px rgba(255,71,87,.35); }
        #toast-stack { position:fixed; top:50px; left:50%; transform:translateX(-50%); z-index:1000001; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
        .toast { background:var(--bg-secondary); border:1px solid var(--border-color); color:var(--text-color); padding:10px 16px; border-radius:10px; font-size:13px; box-shadow:0 10px 30px rgba(0,0,0,.4); opacity:0; transform:translateY(-8px); transition:.25s; }
        .toast.show { opacity:1; transform:translateY(0); }
        .toast.error { border-color:#f38ba8; color:#ffd7e0; }

        #titlebar { background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; height: 42px; user-select: none; -webkit-app-region: drag; }
        #top-tabs-container { display: flex; align-items: center; gap: 6px; padding-left: 8px; flex: 1; overflow: hidden; -webkit-app-region: no-drag; }
        #window-controls { display: flex; -webkit-app-region: no-drag; }
        .w-control-btn { width: 45px; height: 42px; background: transparent; border: none; color: var(--text-color); cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
        .w-control-btn:hover { background: var(--bg-tertiary); }
        #close-btn:hover { background: #e81123; color: white; }

        #app-container { display: flex; height: calc(100vh - 42px); width: 100vw; overflow: hidden; }
        #sidebar { width: 64px; background: var(--bg-secondary); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 10px; z-index: 10; }
        .side-btn { width: 42px; height: 42px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; color: var(--text-secondary); transition: 0.2s; background: transparent; border: none; font-size: 10px; gap: 2px; }
        .side-btn i { font-size: 16px; font-style: normal; }
        .side-btn span { font-size: 8px; font-weight: 700; }
        .side-btn:hover, .side-btn.active { background: var(--bg-tertiary); color: var(--text-color); }
        .logo { width: 36px; height: 36px; border-radius: 8px; cursor: pointer; object-fit: cover; margin-bottom: 10px; }

        #main-view { flex: 1; display: flex; flex-direction: column; background: var(--bg-primary); overflow: hidden; }
        #toolbar { height: 48px; background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; padding: 0 12px; gap: 8px; }
        .nav-tool-btn { width: 34px; height: 34px; border-radius: 8px; background: transparent; border: none; color: var(--text-color); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; font-size: 14px; }
        .nav-tool-btn:hover { background: var(--bg-tertiary); }
        #url-input { flex: 1; height: 34px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 17px; padding: 0 16px; color: var(--text-color); font-size: 13px; outline: none; transition: 0.2s; }
        #url-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(255, 71, 87, 0.2); }

        #wv-container { flex: 1; display: flex; position: relative; background: var(--bg-primary); overflow: hidden; }

        .tab { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 8px; max-width: 160px; min-width: 100px; cursor: pointer; user-select: none; font-size: 12px; color: var(--text-secondary); transition: 0.2s; }
        .tab.active { background: var(--bg-secondary); color: var(--text-color); border-color: var(--accent); }
        .tab-icon { width: 14px; height: 14px; border-radius: 3px; object-fit: contain; }
        .tab-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
        
        #new-tab-btn { width: 32px; height: 32px; background: transparent; border: 1px dashed var(--border-color); border-radius: 8px; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: 0.2s; }
        #new-tab-btn:hover { background: var(--bg-tertiary); color: var(--text-color); border-color: var(--text-color); }
        #tab-dropdown-btn { width: 28px; height: 28px; background: transparent; border: none; color: var(--text-secondary); cursor: pointer; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
        #tab-dropdown-btn:hover { background: var(--bg-tertiary); color: var(--text-color); }
    </style>
</head>
<body>

<div class="main-container">
    <div id="titlebar">
        <div id="top-tabs-container">
            <div style="position: relative; display: inline-block;">
                <button id="tab-dropdown-btn" onclick="toggleTabDropdown(event)" title="Sekmeler Listesi">▼</button>
                <div id="tab-dropdown-menu" style="display: none; position: fixed; top: 45px; left: 12px; width: 300px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; box-shadow: 0 25px 50px rgba(0,0,0,0.8); z-index: 9999999; padding: 10px; flex-direction: column; gap: 8px; backdrop-filter: blur(16px);">
                    <input type="text" id="tab-search-input" placeholder="Sekmelerde ara..." oninput="filterTabs(this.value)" style="width: 100%; height: 36px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 8px; padding: 0 12px; color: var(--text-color); font-size: 13px; outline: none; transition: all 0.2s;">
                    <div id="tab-list-dropdown" style="display: flex; flex-direction: column; gap: 4px; max-height: 250px; overflow-y: auto; scrollbar-width: thin;"></div>
                </div>
            </div>
            <div id="tab-bar"></div>
            <button id="new-tab-btn" onclick="createNewTab(getHomeUrl())" title="Yeni Sekme">＋</button>
        </div>
        <div id="window-controls">
            <button class="w-control-btn" id="min-btn">-</button>
            <button class="w-control-btn" id="max-btn">▢</button>
            <button class="w-control-btn" id="close-btn">×</button>
        </div>
    </div>

    <div id="app-container">
        <div id="sidebar">
            <img src="assets/icons/logo.png" class="logo" onclick="location.reload()" alt="Logo">
            <div style="flex:1"></div>

            <div class="side-btn" id="btn-paint" onclick="togglePaintMenu()"><i>✏️</i><span>KALEM</span></div>
            <div class="side-btn" id="btn-keyboard" onclick="toggleKeyboard()"><i>⌨️</i><span>KLAVYE</span></div>
            <div class="side-btn" onclick="createNewTab(getHomeUrl())"><i>➕</i><span>SEKME</span></div>
            <div class="side-btn" id="btn-split" onclick="toggleSplitScreen()"><i>🌓</i><span>BÖL</span></div>
            <div class="side-btn" onclick="openAISession()"><i>🤖</i><span>AI</span></div>
            <div class="side-btn" id="btn-limit" onclick="toggleLimit()"><i>🔒</i><span>LİMİT</span></div>

            <div style="flex:1"></div>

            <div class="side-btn" onclick="toggleHelp()"><i>❓</i><span>YARDIM</span></div>
            <div class="side-btn" onclick="toggleSettings()"><i>⚙️</i><span>AYARLAR</span></div>
        </div>

        <div id="main-view">
            <div id="toolbar">
                <button class="nav-tool-btn" onclick="goBack()" title="Geri">◀</button>
                <button class="nav-tool-btn" onclick="goForward()" title="İleri">▶</button>
                <button class="nav-tool-btn" onclick="reloadTab()" title="Yenile">🔄</button>
                <input type="text" id="url-input" placeholder="Güvenli Arama...">
                <div id="ai-mode-btn" onclick="toggleAiMode()" title="AI Modu">✨ AI</div>
            </div>
            <div id="wv-container"></div>
        </div>
    </div>
</div>

<div id="update-banner" class="glass-panel" style="display: none; position: fixed; top: 80px; right: 20px; width: 340px; background: rgba(17, 17, 27, 0.95); backdrop-filter: blur(16px); color: #cdd6f4; padding: 20px; border-radius: 16px; border: 1px solid rgba(243, 139, 168, 0.3); z-index: 99999; font-family: 'Segoe UI', system-ui, sans-serif; box-shadow: 0 20px 50px rgba(0,0,0,0.8); box-sizing: border-box; flex-direction: column;">
    <div id="update-step-1">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <strong style="color: #f38ba8; font-size: 15px; display: flex; align-items: center; gap: 6px;">🚀 Güncelleme Mevcut</strong>
            <span style="font-size: 12px; background: #313244; padding: 4px 8px; border-radius: 6px; color: #a6adc8; font-weight: 500; border: 1px solid #45475a;">Anka Web</span>
        </div>
        <p id="update-info" style="font-size: 13px; line-height: 1.5; margin: 0 0 16px 0; color: #bac2de;">Daha hızlı ve kararlı bir deneyim için yeni bir güncelleme hazır.</p>
        <div id="progress-container" style="display: none; width: 100%; background: #313244; height: 6px; border-radius: 3px; overflow: hidden; margin-bottom: 16px;">
            <div id="progress-bar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #f38ba8, #fab387); transition: width 0.1s linear;"></div>
        </div>
        <div id="update-actions" style="display: flex; gap: 10px;">
            <button id="later-btn" style="flex: 1; padding: 10px; background: #313244; border: 1px solid #45475a; color: #cdd6f4; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px;">Daha Sonra</button>
            <button id="update-btn" style="flex: 2; padding: 10px; background: #f38ba8; border: none; color: #11111b; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 13px;">Şimdi Güncelle</button>
        </div>
    </div>
    <div id="update-step-2" style="display: none; text-align: center;">
        <strong style="color: #fab387; font-size: 15px; display: block; margin-bottom: 10px;">⚠️ Kapatma İzni Gerekli</strong>
        <button id="close-app-btn" style="width: 100%; padding: 12px; background: #f38ba8; border: none; color: #11111b; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 13px;">Programı Kapat</button>
    </div>
    <div id="update-step-error" style="display: none;">
        <strong style="color: #f38ba8; font-size: 15px; display: block; margin-bottom: 10px;">❌ Hata Oluştu</strong>
        <p id="error-message" style="font-size: 13px; line-height: 1.5; margin: 0 0 12px 0; color: #f38ba8; background: rgba(243, 139, 168, 0.1); padding: 8px; border-radius: 6px; font-family: monospace; border: 1px solid rgba(243, 139, 168, 0.2);"></p>
        <button id="error-close-btn" style="width: 100%; padding: 10px; background: #313244; border: 1px solid #45475a; color: #cdd6f4; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px;">Kapat</button>
    </div>
</div>

<div id="toast-stack"></div>
<div id="notification-container" style="position: fixed; top: 50px; left: 50%; transform: translateX(-50%); z-index: 1000000; pointer-events: none;"></div>

<script>
    const { ipcRenderer } = require('electron');

    function applySavedTheme() {
        const theme = localStorage.getItem('set_theme') || 'dark';
        if (theme === 'light') {
            document.body.classList.add('light-theme');
        } else {
            document.body.classList.remove('light-theme');
        }
    }
    applySavedTheme();

    function getSetting(id, def) {
        const v = localStorage.getItem('set_' + id);
        return v === null ? def : v;
    }

    function showToast(message, type = 'info') {
        const stack = document.getElementById('toast-stack');
        if (!stack) { console.log(message); return; }
        const el = document.createElement('div');
        el.className = 'toast' + (type === 'error' ? ' error' : '');
        el.textContent = message;
        stack.appendChild(el);
        requestAnimationFrame(() => el.classList.add('show'));
        setTimeout(() => {
            el.classList.remove('show');
            setTimeout(() => el.remove(), 300);
        }, 3500);
    }

    window.addEventListener('error', (e) => {
    });
    window.addEventListener('unhandledrejection', (e) => {
        showToast('İşlem tamamlanamadı: ' + (e.reason && e.reason.message ? e.reason.message : 'bilinmeyen hata'), 'error');
    });

    function safeIpcSend(channel, payload) {
        try {
            ipcRenderer.send(channel, payload);
            return true;
        } catch (err) {
            showToast('Bağlantı hatası (' + channel + ')', 'error');
            return false;
        }
    }

    const banner = document.getElementById('update-banner');
    const step1 = document.getElementById('update-step-1');
    const step2 = document.getElementById('update-step-2');
    const stepError = document.getElementById('update-step-error');
    const updateBtn = document.getElementById('update-btn');
    const laterBtn = document.getElementById('later-btn');
    const closeAppBtn = document.getElementById('close-app-btn');
    const errorCloseBtn = document.getElementById('error-close-btn');
    const infoText = document.getElementById('update-info');
    const progressContainer = document.getElementById('progress-container');
    const progressBar = document.getElementById('progress-bar');
    const errorMessage = document.getElementById('error-message');

    let cachedFilePath = '';

    document.getElementById('min-btn')?.addEventListener('click', () => safeIpcSend('window-minimize'));
    document.getElementById('max-btn')?.addEventListener('click', () => safeIpcSend('window-maximize'));
    document.getElementById('close-btn')?.addEventListener('click', () => safeIpcSend('window-close'));

    ipcRenderer.on('update-available', (event, data) => {
        banner.style.display = 'flex';
        step1.style.display = 'block';
        step2.style.display = 'none';
        stepError.style.display = 'none';
        infoText.innerHTML = `<strong>Yeni Sürüm: ${data.version}</strong><br><small style="color: #a6adc8;">Otomatik yükleme hazırlandı.</small>`;
        updateBtn.style.display = '';
        progressContainer.style.display = 'none';
        laterBtn.style.display = '';
        updateBtn.onclick = () => {
            updateBtn.style.pointerEvents = 'none';
            laterBtn.style.display = 'none';
            updateBtn.style.opacity = '0.5';
            updateBtn.innerText = "Bağlanılıyor...";
            safeIpcSend('start-download', data.url);
        };
    });

    laterBtn.addEventListener('click', () => {
        safeIpcSend('hide-update-banner');
        banner.style.display = 'none';
    });

    ipcRenderer.on('download-progress', (event, percent) => {
        if (updateBtn.style.display !== 'none') {
            updateBtn.style.display = 'none';
            progressContainer.style.display = 'block';
        }
        progressBar.style.width = percent + "%";
        infoText.innerHTML = `Güncelleniyor: <strong>%${percent}</strong>`;
    });

    ipcRenderer.on('download-complete', (event, filePath) => {
        cachedFilePath = filePath;
        step1.style.display = 'none';
        step2.style.display = 'block';
    });

    closeAppBtn.addEventListener('click', () => {
        if (cachedFilePath) {
            safeIpcSend('run-installer', cachedFilePath);
            safeIpcSend('close-app-for-update');
        }
    });

    function showError(message) {
        step1.style.display = 'none';
        step2.style.display = 'none';
        stepError.style.display = 'block';
        errorMessage.textContent = message;
    }

    ipcRenderer.on('download-error', (event, message) => showError(message));
    ipcRenderer.on('install-error', (event, message) => showError(message));

    errorCloseBtn.addEventListener('click', () => {
        safeIpcSend('hide-update-banner');
        banner.style.display = 'none';
    });

    function getHomeUrl() {
        const startup = getSetting('startup-page', 'home');
        if (startup === 'blank') return 'about:blank';
        return 'newtab.html';
    }

    function toggleTabDropdown(e) {
        if (e) e.stopPropagation();
        const menu = document.getElementById('tab-dropdown-menu');
        if (menu.style.display === 'flex') {
            menu.style.display = 'none';
        } else {
            menu.style.display = 'flex';
            renderTabListDropdown();
            const input = document.getElementById('tab-search-input');
            input.value = '';
            input.focus();
        }
    }

    function renderTabListDropdown(filter = '') {
        const listContainer = document.getElementById('tab-list-dropdown');
        listContainer.innerHTML = '';
        const tabs = document.querySelectorAll('.tab');
        let matchedCount = 0;

        tabs.forEach(tab => {
            const id = tab.id.replace('btn-', '');
            const titleEl = tab.querySelector('.tab-title');
            const title = titleEl ? titleEl.innerText : 'Yeni Sekme';
            const vw = document.getElementById(id);
            const url = vw ? vw.getURL() : '';

            if (filter && !title.toLowerCase().includes(filter.toLowerCase()) && !url.toLowerCase().includes(filter.toLowerCase())) {
                return;
            }

            matchedCount++;
            const item = document.createElement('div');
            item.style.cssText = `display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 8px; cursor: pointer; transition: all 0.2s; background: ${id === activeTabId ? 'rgba(255, 71, 87, 0.2)' : 'transparent'}; color: ${id === activeTabId ? '#ff4757' : 'var(--text-color)'};`;
            item.innerHTML = `<span style="font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${title}</span>`;
            item.onclick = () => switchTab(id);
            listContainer.appendChild(item);
        });

        if (matchedCount === 0) {
            listContainer.innerHTML = `<div style="padding: 16px; text-align: center; color: var(--text-secondary); font-size: 13px;">Sekme bulunamadı</div>`;
        }
    }

    function filterTabs(query) {
        renderTabListDropdown(query);
    }

    window.addEventListener('click', (e) => {
        const dropdown = document.getElementById('tab-dropdown-menu');
        const btn = document.getElementById('tab-dropdown-btn');
        if (dropdown && dropdown.style.display === 'flex' && !dropdown.contains(e.target) && !btn.contains(e.target)) {
            dropdown.style.display = 'none';
        }
    });

    function togglePaintMenu() {}
    function toggleKeyboard() {}
    function toggleSplitScreen() {}
    function toggleLimit() {}
    function toggleHelp() {}
    function toggleSettings() {}

    window.addEventListener('load', () => {
        if (typeof setAiMode === 'function' && typeof isAiModeActive === 'function') {
            setAiMode(isAiModeActive());
        }
        if (typeof createNewTab === 'function' && document.querySelectorAll('.tab').length === 0) {
            createNewTab(getHomeUrl());
        }
    });
</script>

<script src="renderer.js"></script>
<script src="src/browser.js"></script>
<script src="src/paint.js"></script>
<script src="src/keyboard.js"></script>
<script src="src/settings.js"></script>
<script src="src/app.js"></script>
<script src="src/help.js"></script>
<script src="src/split-screen.js"></script>
<script src="src/session-manager.js"></script>
<script src="src/limiter.js"></script>
</body>
</html>
